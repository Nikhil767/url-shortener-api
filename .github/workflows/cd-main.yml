name: CD - Main (deploy to MonsterASP)

on:
  push:
    branches:
      - main   # Trigger this workflow whenever code is pushed to the 'main' branch

permissions:
  contents: read   # Limit this workflow to only read repository contents (no write access needed for deployment)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # Run this job on the latest Ubuntu virtual environment provided by GitHub Actions

    steps:
      - name: Checkout main   # Step name: checkout the repository code from the 'main' branch
        uses: actions/checkout@v4   # Use the official 'checkout' action (v4) to fetch the repo

      - name: Setup .NET   # Step name: configure the .NET SDK
        uses: actions/setup-dotnet@v4   # Use the official 'setup-dotnet' action (v4)
        with:
          dotnet-version: '10.0.x'   # Install .NET SDK version 10.0.x (latest 10.0 release)

      - name: Restore   # Step name: restore NuGet packages
        run: dotnet restore ./src/UrlShortener/UrlShortener.csproj   # Restore all dependencies for the main UrlShortener project

      - name: Build   # Step name: build the project
        run: dotnet build ./src/UrlShortener/UrlShortener.csproj --configuration Release --no-restore   # Build the project in Release mode without re-restoring packages

      - name: Publish   # Step name: publish the project for deployment
        run: dotnet publish ./src/UrlShortener/UrlShortener.csproj --configuration Release --output ./publish   # Publish the project in Release mode and output compiled files to the './publish' folder

      # IMPORTANT: keep web.config if MonsterASP already has one customized
      # (optional safety step)
      # Comment: this is a note reminding you to preserve any existing web.config on the server if MonsterASP uses a customized one
      # This is not an actual command; it's just documentation for humans

      - name: Preserve remote web.config (optional, if needed)   # Step name: note about preserving web.config
        run: echo "Handled by FTP action include/exclude patterns if required"   # This is just an echo; actual web.config handling is done via FTP action options (include/exclude patterns)

      - name: Deploy via FTP to MonsterASP   # Step name: deploy the published files to MonsterASP using FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6   # Use the 'FTP-Deploy-Action' (v4) to upload files via FTP
        with:
          server: ${{ secrets.FTP_HOST }}   # FTP server hostname from GitHub secrets
          username: ${{ secrets.FTP_USERNAME }}   # FTP username from GitHub secrets
          password: ${{ secrets.FTP_PASSWORD }}   # FTP password from GitHub secrets
          port: ${{ secrets.FTP_PORT }}   # FTP port number from GitHub secrets (e.g., 21 for standard FTP)
          protocol: ftp   # Use FTP protocol (not FTPS or SFTP)
          local-dir: ./publish   # Local directory containing the published files to upload
          server-dir: /wwwroot   # Target directory on the FTP server where files will be uploaded
          dangerous-clean-slate: false   # Do not delete all files on the server before uploading (keeps existing files like web.config unless explicitly overwritten)

      - name: Health Check (after deploy)
        run: |
          echo "Waiting 10 seconds for app to restart..."
          sleep 10
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://nikhilapi.runasp.net/Admin)
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed. Status code: $STATUS"
            exit 1
          fi
          echo "✅ Health check passed. API is live."
